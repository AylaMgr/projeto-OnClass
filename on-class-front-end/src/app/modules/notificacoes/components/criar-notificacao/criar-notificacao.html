<div class="form-container">
  <h3 class="form-title">Enviar Notificação de Ausência</h3>

  <div *ngIf="sucesso" class="success-message">
    Notificação enviada com sucesso!
  </div>

  <div *ngIf="erro" class="error-message">
    {{ erro }}
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Motivo</label>
      <select class="form-control" formControlName="motivo">
        <option value="" disabled selected>Selecione um motivo</option>
        <option value="PROBLEMA DE SAÚDE LEVE">PROBLEMA DE SAÚDE LEVE</option>
        <option value="IMPREVISTO PESSOAL">IMPREVISTO PESSOAL</option>
        <option value="CONSULTA MÉDICA">CONSULTA MÉDICA</option>
        <option value="OUTRO">OUTRO</option>
      </select>
    </div>

    <div class="row-dates">
      <div class="form-group">
        <label>Início</label>
        <input 
          type="date" 
          class="form-control" 
          formControlName="dataInicio" 
          [max]="form.get('dataFim')?.value" 
        />
      </div>
      <div class="form-group">
        <label>Fim</label>
        <input 
          type="date" 
          class="form-control" 
          formControlName="dataFim" 
          [min]="form.get('dataInicio')?.value" 
        />
      </div>
    </div>

    <!-- Mensagem de erro caso a data final seja menor que a inicial -->
    <div *ngIf="form.get('dataFim')?.hasError('dataInvalida')" class="error-message" style="margin-top: 8px;">
      A data de fim não pode ser anterior à data de início.
    </div>

    <div class="form-group" style="margin-top: 12px;">
      <label>Descrição / Justificação</label>
      <textarea class="form-control" rows="3" formControlName="descricao" placeholder="Descreva o motivo (mínimo 10 caracteres)..."></textarea>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="declaracaoVeracidade" formControlName="declaracaoVeracidade" />
      <label for="declaracaoVeracidade">Declaro que as informações fornecidas são verdadeiras.</label>
    </div>

    <button type="submit" class="btn-enviar" [disabled]="form.invalid">
      Enviar Notificação
    </button>
  </form>
</div>
