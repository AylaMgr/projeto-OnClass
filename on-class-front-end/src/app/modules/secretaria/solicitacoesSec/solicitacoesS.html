<div class="secretaria-page">
  <!-- Header Superior Azul Escuro -->
  <header class="top-header">
    <div class="header-left">
      <button type="button" class="btn-back" (click)="voltarDash()" title="Voltar ao Dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 8l-4 4 4 4M16 12H8"></path>
        </svg>
      </button>
      <div class="header-titles">
        <h1>Olá, Secretaria</h1>
        <span>Portal dos Docentes</span>
      </div>
    </div>

    <!-- Campo de Busca por Matrícula -->
    <div class="header-search">
      <input 
        type="text" 
        placeholder="Nº de Matrícula ou Nome" 
        [(ngModel)]="termoBuscaMatricula" 
      />
    </div>

    <!-- Ações do Usuário -->
    <div class="header-right">
      <button type="button" class="icon-btn" title="Notificações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
      <button type="button" class="avatar-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
    </div>
  </header>

  <!-- Filtros Superiores -->
  <div class="filters-bar">
    <span class="filter-label">Filtrar:</span>
    
    <div class="filter-select">
      <select [(ngModel)]="filtroTurno">
        <option value="">TURNO</option>
        <option value="matutino">Matutino</option>
        <option value="vespertino">Vespertino</option>
        <option value="noturno">Noturno</option>
      </select>
    </div>

    <div class="filter-select">
      <select [(ngModel)]="filtroOrdem">
        <option value="recente">ORDEM</option>
        <option value="antigo">Mais Antigos</option>
      </select>
    </div>

    <div class="filter-select">
      <select [(ngModel)]="filtroTurma">
        <option value="">TURMA</option>
        <option value="t1">Engenharia A</option>
        <option value="t2">Medicina B</option>
      </select>
    </div>
  </div>

  <!-- Card Principal de Conteúdo -->
  <main class="content-card">
    <!-- Navegação por Abas -->
    <div class="tabs-navigation">
      <button 
        type="button" 
        class="tab-btn" 
        [class.active]="abaAtiva === 'recentes'"
        (click)="mudarAba('recentes')">
        Recebidos Recentemente
      </button>
      <button 
        type="button" 
        class="tab-btn" 
        [class.active]="abaAtiva === 'manuais'"
        (click)="mudarAba('manuais')">
        Análises Manuais
      </button>
    </div>

    <!-- Lista de Solicitações -->
    <div class="requests-list">
      <div 
        *ngFor="let item of solicitacoesFiltradas" 
        class="request-card">
        
        <div class="request-info">
          <div class="request-meta">
            <span class="matricula">{{ item.matricula }}</span>
            <span class="data-hora">{{ item.dataHora }}</span>
          </div>
          <h3 class="aluno-nome">{{ item.aluno }}</h3>
          <p class="solicitacao-tipo">{{ item.tipo }}</p>
        </div>

        <div class="request-status-wrapper">
          <span 
            class="status-tag"
            [ngClass]="{
              'status-pendente': item.status === 'Pendente',
              'status-analise': item.status === 'Em Análise',
              'status-aprovada': item.status === 'Aprovada',
              'status-rejeitada': item.status === 'Rejeitada'
            }">
            {{ item.status }}
          </span>
        </div>
      </div>

      <!-- Estado Vazio -->
      <div class="empty-state" *ngIf="solicitacoesFiltradas.length === 0">
        <p>Nenhuma solicitação encontrada para esta aba/filtro.</p>
      </div>
    </div>
  </main>
</div>
