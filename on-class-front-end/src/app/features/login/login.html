<div class="login-wrapper">
  <div class="login-card">
    <!-- Logotipo com ícone sobreposto -->
    <div class="logo-container">
      <div class="logo-badge">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V8L14 2Z" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 2V8H20" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 15L11 17L15 13" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="brand-title">OnClass</h1>
      <p class="brand-subtitle">— A SOLUÇÃO DIGITAL PARA —<br>JUSTIFICATIVAS ESCOLARES</p>
    </div>

    <p class="section-title">ENTRE COM O SEU PERFIL PROESC</p>

    <!-- Seleção de Perfis -->
    <div class="profile-group">
      <button 
        type="button" 
        class="profile-card"
        [class.active]="perfilSelecionado === 'PROFESSOR'"
        (click)="selecionarPerfil('PROFESSOR')">
        Professor
      </button>

      <button 
        type="button" 
        class="profile-card"
        [class.active]="perfilSelecionado === 'ALUNO_RESPONSAVEL'"
        (click)="selecionarPerfil('ALUNO_RESPONSAVEL')">
        Aluno<br>ou<br>Responsavel
      </button>

      <button 
        type="button" 
        class="profile-card"
        [class.active]="perfilSelecionado === 'SECRETARIA'"
        (click)="selecionarPerfil('SECRETARIA')">
        Secretaria
      </button>
    </div>

    <!-- Formulário -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="input-field">
        <label for="email">E-mail ou Usuário</label>
        <input 
          id="email" 
          type="text" 
          formControlName="emailOuUsuario"
          placeholder="exemplo@gmail.com" />
      </div>

      <div class="input-field">
        <label for="senha">Senha</label>
        <div class="password-box" [class.focused]="senhaFocada">
          <input 
            id="senha" 
            [type]="ocultarSenha ? 'password' : 'text'" 
            formControlName="senha"
            placeholder="digite sua senha"
            (focus)="senhaFocada = true"
            (blur)="senhaFocada = false" />
          <button 
            type="button" 
            class="eye-btn" 
            (click)="alternarVisibilidadeSenha()"
            tabindex="-1">
            <svg *ngIf="ocultarSenha" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            <svg *ngIf="!ocultarSenha" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">
        ENTRAR
      </button>

      <div class="forgot-password">
        <span>esqueceu a senha? </span>
        <a href="javascript:void(0)">clique aqui!</a>
      </div>
    </form>
  </div>
</div>
