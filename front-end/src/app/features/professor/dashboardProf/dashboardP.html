<div class="dashboard-prof-container">
  <!-- Topo escuro conforme imagem -->
 <app-top-bar
  titulo="Olá, Professor"
  subtitulo="Portal dos Docentes"
  placeholder="Pesquisar por Nome Completo ou Nº de Matrícula"
  [(termoPesquisa)]="termoMatricula"
  (voltarClick)="voltarLogin()">
</app-top-bar>
  
  <!-- Conteúdo Principal -->
  <main class="main-content">
    <div class="filter-bar">
      <app-filter-bar
        rotulo="Filtrar:"
        [dropdowns]="filtrosProfessor"
        (filtroChange)="onFiltroProfessorChange($event)">
      </app-filter-bar>

      <button
        type="button"
        class="btn-clear"
        (click)="resetarFiltrosProfessor()"
        *ngIf="termoMatricula || turnoSelecionado || turmaSelecionada || ordemSelecionada">
        Limpar Filtros
      </button>
    </div>

    <!-- Container da Lista de Solicitações -->
    <div class="content-card">
      <div class="card-header">
        <div>
          <h2>Análises Manuais</h2>
          <p class="subtitle">Aguardando revisão ou recentemente atualizados</p>
        </div>
        <a class="link-historico" (click)="resetarFiltrosProfessor()">Ver Histórico</a>
      </div>

      <!-- Lista de Cards das Solicitações -->
      <div class="cards-list">
  <div 
    class="solicitacao-card" 
    *ngFor="let item of solicitacoesFiltradas"
    (click)="abrirSolicitacao(item.id)">
    
    <div class="card-info">
      <div class="card-meta">
        <span class="matricula-text">Nº {{ item.matricula }}</span>
        <span class="data-text">{{ item.dataEnvio }}</span>
      </div>
      <h3 class="aluno-nome">{{ item.aluno }}</h3>
      <p class="motivo-text">{{ item.motivo }}</p>
    </div>

    <div class="card-status">
      <!-- Badge ENCAMINHADO_PROFESSOR / APROVADO_SECRETARIA -->
     <div class="card-status">
  <app-status-badge
    [status]="item.status"
    [label]="item.status === 'ENCAMINHADO_PROFESSOR' || item.status === 'APROVADO_SECRETARIA' ? 'Pendente' : undefined">
  </app-status-badge>
  </div>
    </div>
  </div>

  <!-- Estado Vazio -->
  <div class="empty-state" *ngIf="solicitacoesFiltradas.length === 0">
    <p>Nenhuma solicitação encontrada.</p>
  </div>
</div>
      </div>
  </main>
</div>
